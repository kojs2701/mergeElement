<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원소 합성 - 화학물질 만들기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 초기 소개 화면 -->
    <div id="introScreen" class="intro-screen active">
        <div class="intro-content">
            <h1>🧪 원소 합성</h1>
            <p>원소들을 결합하여 신비한 화학물질을 만들어보세요!</p>
            <button id="startBtn" class="start-btn">시작하기</button>
            <input type="text" id="loadCodeInput" class="load-code-input" placeholder="저장 코드 입력 (선택)" aria-label="저장 코드 입력">
            <div style="margin-top: 30px; font-size: 12px;">
                <!-- 대체 시작 버튼 및 콘솔 안내 제거 (사용자 요청) -->
            </div>
        </div>
    </div>

    <!-- 튜토리얼 미션 바 -->
    <div id="tutorialBar" class="tutorial-bar"></div>

    <div class="container">
        <!-- 상단 헤더 -->
        <header class="header">
            <div class="header-top">
                <div class="money-display">
                    <span class="money-label">💰 돈:</span>
                    <span class="money-amount" id="moneyAmount">0</span>
                    <span class="money-label">원</span>
                    <span class="money-per-second" id="moneyPerSecond">(+0/s)</span>
                </div>
                <div class="discovered-count">
                    <span class="label">해금한 원소:</span>
                    <span class="count" id="discoveredCount">0</span>
                    <span class="label">/</span>
                    <span class="total" id="totalCount">0</span>
                    <button id="collectionBtn" class="collection-btn">🖼️ 수집품 보관함</button>
                </div>
            </div>
            <div class="header-tabs">
                <button class="tab-btn active" data-tab="synthesis">⚗️ 합성소</button>
                <button class="tab-btn" data-tab="shop">🛍️ 상점</button>
                <button class="tab-btn" data-tab="recipe">📖 레시피</button>
            </div>
        </header>

        <!-- 합성 화면 -->
        <div id="synthesisScreen" class="screen-container active">
            <div class="main-content">
                <!-- 왼쪽 사이드바 - 보유한 원소들 -->
                <aside class="left-sidebar">
                    <h2>보유한 원소</h2>
                    <div class="element-inventory" id="elementInventory">
                        <!-- 원소들이 여기에 추가됨 -->
                    </div>
                </aside>

                <!-- 중앙 메인 영역 - 합성 영역 -->
                <main class="center-area">
                    <h2>원소 합성</h2>
                    <div class="synthesis-area" id="synthesisArea">
                        <div class="synthesis-container" id="synthesisContainer">
                            <!-- 드롭한 원소들이 여기에 표시됨 -->
                        </div>
                        <div class="synthesis-controls">
                            <button id="synthesisBtn" class="synthesis-btn">⚗️ 합성하기</button>
                        </div>
                        <div class="result-display" id="resultDisplay">
                            <!-- 합성 결과가 여기 표시됨 -->
                        </div>
                    </div>
                </main>

                <!-- 오른쪽 사이드바 - 해금된 화학물질 -->
                <aside class="right-sidebar">
                    <h2>해금된 화학물질</h2>
                    <div class="compound-list" id="compoundList">
                        <!-- 해금된 화학물질들이 여기에 추가됨 -->
                    </div>
                </aside>
            </div>
        </div>

        <!-- 상점 화면 -->
        <div id="shopScreen" class="screen-container">
            <div class="shop-content">
                <div class="shop-header">
                    <h2>🛍️ 원소 판매점</h2>
                </div>
                <div class="shop-board-container">
                    <button class="shop-scroll-btn shop-scroll-left" id="shopScrollLeft">◀</button>
                    <div class="shop-board" id="shopBoard">
                        <!-- 상품 카드들이 여기에 추가됨 -->
                    </div>
                    <button class="shop-scroll-btn shop-scroll-right" id="shopScrollRight">▶</button>
                </div>
            </div>
        </div>

        <!-- 레시피 화면 -->
        <div id="recipeScreen" class="screen-container">
            <div class="recipe-content">
                <div class="recipe-header">
                    <h2>📖 합성 레시피</h2>
                </div>
                <div class="recipe-board" id="recipeBoard">
                    <!-- 레시피들이 여기에 추가됨 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 정보 모달 팝업 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-close" id="modalClose">&times;</div>
            <div class="modal-title" id="modalTitle">물</div>
            <div class="modal-formula" id="modalFormula">H₂O</div>
            <div class="modal-info" id="modalInfo">
                <!-- 정보가 여기에 추가됨 -->
            </div>
        </div>
    </div>

    <!-- 수집품 화면 -->
    <div id="collectionScreen" class="collection-screen">
        <div class="collection-header">
            <h2>🏛️ 나의 화학물질 컬렉션</h2>
            <button id="backBtn" class="back-btn">← 돌아가기</button>
        </div>
        <div class="collection-display" id="collectionDisplay">
            <!-- 만들어진 분자들이 여기서 떠돌아다님 -->
        </div>
        
        <!-- 용광로 (분해) -->
        <div class="furnace-container">
            <div class="furnace" id="furnace">
                <div class="furnace-icon">🔥</div>
                <div class="furnace-label">분해로</div>
            </div>
        </div>
    </div>

    <!-- 저장 코드 팝업 오버레이 -->
    <div id="codeOverlay" class="code-overlay">
        <div class="code-popup">
            <div id="generatedCode" class="generated-code">코드가 여기에 표시됩니다</div>
            <div class="copy-hint">클릭하여 복사</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
